// ==========================================
// 7. MediaAdapter.kt
// ==========================================
package com.liteplay.ultralite

import android.view.LayoutInflater
import android.view.View
import android.view.ViewGroup
import android.widget.ImageButton
import android.widget.ImageView
import android.widget.TextView
import androidx.recyclerview.widget.RecyclerView

class MediaAdapter(
    private val items: List<MediaItemModel>,
    private val onItemClick: (Int) -> Unit,
    private val onFavoriteToggle: (MediaItemModel, Int) -> Unit
) : RecyclerView.Adapter<MediaAdapter.MediaViewHolder>() {

    class MediaViewHolder(itemView: View) : RecyclerView.ViewHolder(itemView) {
        val title: TextView = itemView.findViewById(R.id.txtTitle)
        val artist:TextView = itemView.findViewById(R.id.txtArtist)
        val imgType: ImageView = itemView.findViewById(R.id.imgType)
        val btnFav: ImageButton = itemView.findViewById(R.id.btnFav)
    }

    override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): MediaViewHolder {
        val view = LayoutInflater.from(parent.context).inflate(R.layout.item_media, parent, false)
        return MediaViewHolder(view)
    }

    override fun onBindViewHolder(holder: MediaViewHolder, position: Int) {
        val item = items[position]
        holder.title.text = item.title
        holder.artist.text = item.artist

        holder.btnFav.setImageResource(
            if (item.isFavorite) android.R.drawable.star_on else android.R.drawable.star_off
        )

        holder.itemView.setOnClickListener { onItemClick(position) }
        holder.btnFav.setOnClickListener { onFavoriteToggle(item, position) }
    }

    override fun getItemCount(): Int = items.size
}

// ==========================================
// 8. MainActivity.kt
// ==========================================
package com.liteplay.ultralite

import android.Manifest
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.content.ServiceConnection
import android.content.pm.PackageManager
import android.database.Cursor
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.os.IBinder
import android.provider.MediaStore
import android.view.View
import androidx.appcompat.app.AppCompatActivity
import androidx.core.app.ActivityCompat
import androidx.core.content.ContextCompat
import androidx.media3.common.Player
import androidx.recyclerview.widget.LinearLayoutManager
import com.liteplay.ultralite.databinding.ActivityMainBinding

class MainActivity : AppCompatActivity() {

    private lateinit var binding: ActivityMainBinding
    private lateinit var prefsManager: PrefsManager
    private val mediaList = ArrayList<MediaItemModel>()
    private lateinit var adapter: MediaAdapter

    private var playbackService: PlaybackService? = null
    private var isBound = false

    private val playerListener = object : Player.Listener {
        override fun onPlaybackStateChanged(playbackState: Int) {
            updateMiniPlayer()
        }

        override fun onIsPlayingChanged(isPlaying: Boolean) {
            updateMiniPlayer()
        }

        override fun onMediaItemTransition(mediaItem: androidx.media3.common.MediaItem?, reason: Int) {
            updateMiniPlayer()
        }

        override fun onRepeatModeChanged(repeatMode: Int) {
            updateRepeatButtonUI(repeatMode)
        }
    }

    private val serviceConnection = object : ServiceConnection {
        override fun onServiceConnected(name: ComponentName?, service: IBinder?) {
            val binder = service as PlaybackService.LocalBinder
            playbackService = binder.getService()
            isBound = true
            playbackService?.player?.addListener(playerListener)
            updateMiniPlayer()
            playbackService?.player?.let { updateRepeatButtonUI(it.repeatMode) }
        }

        override fun onServiceDisconnected(name: ComponentName?) {
            playbackService?.player?.removeListener(playerListener)
            playbackService = null
            isBound = false
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        binding = ActivityMainBinding.inflate(layoutInflater)
        setContentView(binding.root)

        prefsManager = PrefsManager(this)

        setupRecyclerView()
        setupMiniPlayerControls()
        checkPermissionsAndLoad()

        val serviceIntent = Intent(this, PlaybackService::class.java)
        startService(serviceIntent)
        bindService(serviceIntent, serviceConnection, Context.BIND_AUTO_CREATE)
    }

    private fun setupRecyclerView() {
        adapter = MediaAdapter(
            mediaList,
            onItemClick = { position ->
                playbackService?.playMediaList(mediaList, position)
            },
            onFavoriteToggle = { item, position ->
                val newStatus = prefsManager.toggleFavorite(item.id)
                item.isFavorite = newStatus
                adapter.notifyItemChanged(position)
                updateMiniPlayer()
            }
        )
        binding.recyclerViewMedia.layoutManager = LinearLayoutManager(this)
        binding.recyclerViewMedia.adapter = adapter
    }

    private fun setupMiniPlayerControls() {
        binding.btnMiniPlayPause.setOnClickListener {
            val player = playbackService?.player ?: return@setOnClickListener
            if (player.isPlaying) player.pause() else player.play()
            updateMiniPlayer()
        }

        binding.btnMiniRepeat.setOnClickListener {
            val nextMode = playbackService?.cycleRepeatMode() ?: Player.REPEAT_MODE_OFF
            updateRepeatButtonUI(nextMode)
        }

        binding.btnMiniFavorite.setOnClickListener {
            val player = playbackService?.player ?: return@setOnClickListener
            val currentIndex = player.currentMediaItemIndex
            if (currentIndex in mediaList.indices) {
                val item = mediaList[currentIndex]
                val newState = prefsManager.toggleFavorite(item.id)
                item.isFavorite = newState
                adapter.notifyItemChanged(currentIndex)
                binding.btnMiniFavorite.setImageResource(
                    if (newState) android.R.drawable.star_on else android.R.drawable.star_off
                )
            }
        }
    }

    private fun updateRepeatButtonUI(repeatMode: Int) {
        when (repeatMode) {
            Player.REPEAT_MODE_OFF -> {
                binding.btnMiniRepeat.text = "OFF"
                binding.btnMiniRepeat.setTextColor(0xFF888888.toInt())
            }
            Player.REPEAT_MODE_ALL -> {
                binding.btnMiniRepeat.text = "ALL"
                binding.btnMiniRepeat.setTextColor(0xFF03DAC5.toInt())
            }
            Player.REPEAT_MODE_ONE -> {
                binding.btnMiniRepeat.text = "ONE"
                binding.btnMiniRepeat.setTextColor(0xFFFF4081.toInt())
            }
        }
    }

    private fun updateMiniPlayer() {
        val player = playbackService?.player
        if (player == null || player.mediaItemCount == 0) {
            binding.miniPlayerLayout.visibility = View.GONE
            return
        }

        binding.miniPlayerLayout.visibility = View.VISIBLE
        val currentIndex = player.currentMediaItemIndex

        if (currentIndex in mediaList.indices) {
            val currentMedia = mediaList[currentIndex]
            binding.txtMiniTitle.text = currentMedia.title
            binding.txtMiniArtist.text = currentMedia.artist

            val isFav = prefsManager.isFavorite(currentMedia.id)
            binding.btnMiniFavorite.setImageResource(
                if (isFav) android.R.drawable.star_on else android.R.drawable.star_off
            )
        }

        binding.btnMiniPlayPause.setImageResource(
            if (player.isPlaying) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play
        )
    }

    private fun checkPermissionsAndLoad() {
        val permission = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            Manifest.permission.READ_MEDIA_AUDIO
        } else {
            Manifest.permission.READ_EXTERNAL_STORAGE
        }

        if (ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED) {
            loadDeviceAudio()
        } else {
            ActivityCompat.requestPermissions(this, arrayOf(permission), 200)
        }
    }

    private fun loadDeviceAudio() {
        mediaList.clear()
        val uri: Uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
        val projection = arrayOf(
            MediaStore.Audio.Media._ID,
            MediaStore.Audio.Media.TITLE,
            MediaStore.Audio.Media.ARTIST,
            MediaStore.Audio.Media.DURATION
        )
        val selection = "${MediaStore.Audio.Media.IS_MUSIC} != 0"

        val cursor: Cursor? = contentResolver.query(uri, projection, selection, null, null)
        cursor?.use {
            val idCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
            val titleCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
            val artistCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
            val durationCol = it.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)

            while (it.moveToNext()) {
                val id = it.getLong(idCol)
                val title = it.getString(titleCol) ?: "Unknown"
                val artist = it.getString(artistCol) ?: "Unknown"
                val duration = it.getLong(durationCol)
                val contentUri = Uri.withAppendedPath(uri, id.toString())

                mediaList.add(
                    MediaItemModel(
                        id = id,
                        title = title,
                        artist = artist,
                        uri = contentUri,
                        duration = duration,
                        isFavorite = prefsManager.isFavorite(id)
                    )
                )
            }
        }
        adapter.notifyDataSetChanged()
    }

    override fun onDestroy() {
        if (isBound) {
            playbackService?.player?.removeListener(playerListener)
            unbindService(serviceConnection)
            isBound = false
        }
        super.onDestroy()
    }
}

