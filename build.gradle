// ==========================================
// 1. app/build.gradle (Dependencies)
// ==========================================
plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.liteplay.ultralite'
    compileSdk 34

    defaultConfig {
        applicationId "com.liteplay.ultralite"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
}

// ==========================================
// 2. Data Model: MediaItemModel.kt
// ==========================================
package com.liteplay.ultralite

import android.net.Uri

data class MediaItemModel(
    val id: Long,
    val title: String,
    val artist: String,
    val uri: Uri,
    val duration: Long,
    val isVideo: Boolean = false,
    var isFavorite: Boolean = false
)

// ==========================================
// 3. PrefsManager.kt (Favorites Manager)
// ==========================================
package com.liteplay.ultralite

import android.content.Context
import android.content.SharedPreferences

class PrefsManager(context: Context) {
    private val prefs: SharedPreferences = context.getSharedPreferences("liteplay_prefs", Context.MODE_PRIVATE)

    fun isFavorite(mediaId: Long): Boolean {
        val favs = prefs.getStringSet(KEY_FAVORITES, emptySet()) ?: emptySet()
        return favs.contains(mediaId.toString())
    }

    fun toggleFavorite(mediaId: Long): Boolean {
        val favs = (prefs.getStringSet(KEY_FAVORITES, emptySet()) ?: emptySet()).toMutableSet()
        val idStr = mediaId.toString()
        val isFavNow = if (favs.contains(idStr)) {
            favs.remove(idStr)
            false
        } else {
            favs.add(idStr)
            true
        }
        prefs.edit().putStringSet(KEY_FAVORITES, favs).apply()
        return isFavNow
    }

    companion object {
        private const val KEY_FAVORITES = "favorite_items_ids"
    }
}

// ==========================================
// 4. PlaybackService.kt
// ==========================================
package com.liteplay.ultralite

import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.content.Intent
import android.os.Binder
import android.os.Build
import android.os.IBinder
import androidx.core.app.NotificationCompat
import androidx.media3.common.MediaItem
import androidx.media3.common.Player
import androidx.media3.exoplayer.ExoPlayer

class PlaybackService : android.app.Service() {

    private val binder = LocalBinder()
    lateinit var player: ExoPlayer
        private set

    inner class LocalBinder : Binder() {
        fun getService(): PlaybackService = this@PlaybackService
    }

    override fun onCreate() {
        super.onCreate()
        player = ExoPlayer.Builder(this).build()
        createNotificationChannel()
    }

    override fun onBind(intent: Intent?): IBinder = binder

    fun playMediaList(items: List<MediaItemModel>, startIndex: Int) {
        player.clearMediaItems()
        val mediaItems = items.map { MediaItem.fromUri(it.uri) }
        player.setMediaItems(mediaItems, startIndex, 0L)
        player.prepare()
        player.play()
        startForegroundNotification()
    }

    fun cycleRepeatMode(): Int {
        val nextMode = when (player.repeatMode) {
            Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ALL
            Player.REPEAT_MODE_ALL -> Player.REPEAT_MODE_ONE
            else -> Player.REPEAT_MODE_OFF
        }
        player.repeatMode = nextMode
        return nextMode
    }

    private fun startForegroundNotification() {
        val pendingIntent = PendingIntent.getActivity(
            this, 0,
            Intent(this, MainActivity::class.java),
            PendingIntent.FLAG_IMMUTABLE
        )

        val notification = NotificationCompat.Builder(this, CHANNEL_ID)
            .setContentTitle("LitePlay Ultra Lite")
            .setContentText("Playing media...")
            .setSmallIcon(android.R.drawable.ic_media_play)
            .setContentIntent(pendingIntent)
            .setOngoing(true)
            .build()

        startForeground(NOTIFICATION_ID, notification)
    }

    private fun createNotificationChannel() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val channel = NotificationChannel(
                CHANNEL_ID,
                "Playback Service Channel",
                NotificationManager.IMPORTANCE_LOW
            )
            getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
        }
    }

    override fun onDestroy() {
        player.release()
        super.onDestroy()
    }

    companion object {
        private const val CHANNEL_ID = "playback_channel_01"
        private const val NOTIFICATION_ID = 1001
    }
}

